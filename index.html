<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WirthSim — Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0f1e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #94a3b8; margin-bottom: 3rem; }
    .cards { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2rem 3rem;
      text-decoration: none;
      color: #fff;
      transition: transform 0.2s, background 0.2s;
    }
    .card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.1); }
    .card .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; margin-bottom: 0.5rem; }
    .card .name { font-size: 1.5rem; font-weight: 600; }
    .card.dark .name { color: #60a5fa; }
    .card.light .name { color: #f59e0b; }
    .card .desc { font-size: 0.875rem; color: #94a3b8; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>WirthSim</h1>
    <p>Выберите версию сайта</p>
    <div class="cards">
      <a href="vs2/" class="card dark">
        <div class="label">Версия 1</div>
        <div class="name">VS2 — Dark</div>
        <div class="desc">Тёмная тема · Glassmorphism</div>
      </a>
      <a href="vs3/" class="card light">
        <div class="label">Версия 2</div>
        <div class="name">VS3 — Light</div>
        <div class="desc">Светлая тема · Clean UI</div>
      </a>
    </div>
  </div>
</body>
</html>
