name: Deploy site

# Publishes to the gh-pages branch, which is what GitHub Pages serves.
#   push to master      -> refresh the site root
#   push tag v*         -> add a frozen snapshot under /v/<tag>/
#   manual run          -> add a frozen snapshot of any commit under /v/<label>/
# Snapshots are never touched by later deploys.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to freeze'
        required: true
      label:
        description: 'Folder name under /v/ (e.g. v1-original)'
        required: true

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the version being published
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          path: src
          # Full history so an arbitrary commit SHA can be checked out
          fetch-depth: 0

      - name: Check out gh-pages (create it on first run)
        env:
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -e
          if git clone --branch gh-pages --depth 1 "$REPO" site 2>/dev/null; then
            echo "gh-pages checked out"
          else
            echo "gh-pages does not exist yet — creating it"
            git clone --depth 1 "$REPO" site
            cd site
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null
            touch .nojekyll
          fi

      - name: Work out what to publish and where
        id: target
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=snapshot"                            >> "$GITHUB_OUTPUT"
            echo "label=${{ github.event.inputs.label }}"   >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "mode=snapshot"                            >> "$GITHUB_OUTPUT"
            echo "label=${{ github.ref_name }}"             >> "$GITHUB_OUTPUT"
          else
            echo "mode=root"                                >> "$GITHUB_OUTPUT"
          fi

      - name: Copy files into gh-pages
        run: |
          set -e
          COMMON="--exclude .git --exclude .github --exclude _notes --exclude tools"
          if [ "${{ steps.target.outputs.mode }}" = "root" ]; then
            # Replace the root, but keep snapshots and git metadata
            find site -mindepth 1 -maxdepth 1 \
              ! -name .git ! -name v ! -name .nojekyll -exec rm -rf {} +
            rsync -a $COMMON src/ site/
          else
            DEST="site/v/${{ steps.target.outputs.label }}"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            # Heavy media lives once at the site root; snapshots link to it
            # instead of carrying their own 27 MB copy.
            rsync -a $COMMON --exclude assets src/ "$DEST"/
            find "$DEST" -name '*.html' -exec \
              sed -i "s|\.\./assets/|/${{ github.event.repository.name }}/assets/|g" {} +
            # Remember which commit this snapshot froze, so the version log
            # can list the commits between one snapshot and the next.
            SHA=$(git -C src rev-parse HEAD)
            DATE=$(git -C src log -1 --format=%cI)
            printf '{"label":"%s","sha":"%s","date":"%s"}\n' \
              "${{ steps.target.outputs.label }}" "$SHA" "$DATE" > "$DEST/meta.json"
          fi
          touch site/.nojekyll

      - name: Rebuild the version index
        run: |
          set -e
          # The log spans commits that may be newer than the checked-out ref
          git -C src fetch --quiet origin master:refs/remotes/origin/master || true
          git -C src rev-parse --verify HEAD >/dev/null
          node src/tools/gen-versions.js site src

      - name: Commit and push
        run: |
          set -e
          cd site
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "deploy: ${{ steps.target.outputs.mode }} ${{ steps.target.outputs.label }} (from ${{ github.sha }})"
          git push origin gh-pages
